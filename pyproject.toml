[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "windows-pet"
version = "0.1.0"
description = "A minimal transparent desktop pet for Windows 11"
requires-python = ">=3.12,<3.14"
dependencies = ["PySide6>=6.7,<7", "openai>=1.0,<2"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
